<svg xmlns="http://www.w3.org/2000/svg" width="400" height="520" viewBox="0 0 400 520">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0a0d"/>
      <stop offset="100%" stop-color="#130f1a"/>
    </linearGradient>
    <radialGradient id="glow3" cx="50%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#b13cff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <filter id="blur3">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <rect width="400" height="520" fill="url(#bg3)"/>
  <circle cx="200" cy="190" r="150" fill="url(#glow3)"/>
  <!-- Scholarly robed figure -->
  <path d="M100 440 L100 310 C100 260 130 210 170 200 C165 170 160 120 170 90 C175 110 180 130 185 145 C190 130 195 110 200 90 C205 120 200 170 195 200 C235 210 265 260 265 310 L265 440 Z M160 440 L160 230 M240 440 L240 230" fill="#0e0d12" stroke="#b13cff" stroke-width="1.5" stroke-opacity="0.25"/>
  <!-- Glowing runes floating around -->
  <text x="120" y="140" fill="#b13cff" font-family="serif" font-size="14" opacity="0.4">᚛</text>
  <text x="280" y="140" fill="#b13cff" font-family="serif" font-size="14" opacity="0.4">᚜</text>
  <text x="100" y="200" fill="#b13cff" font-family="serif" font-size="12" opacity="0.3">✦</text>
  <text x="300" y="200" fill="#b13cff" font-family="serif" font-size="12" opacity="0.3">✦</text>
  <text x="130" y="110" fill="#b13cff" font-family="serif" font-size="10" opacity="0.25">𓂀</text>
  <text x="270" y="110" fill="#b13cff" font-family="serif" font-size="10" opacity="0.25">𓂀</text>
  <!-- Eyes -->
  <ellipse cx="185" cy="185" rx="7" ry="4" fill="#b13cff" opacity="0.5" filter="url(#blur3)"/>
  <ellipse cx="215" cy="185" rx="7" ry="4" fill="#b13cff" opacity="0.5" filter="url(#blur3)"/>
  <rect x="8" y="8" width="384" height="504" rx="12" fill="none" stroke="rgba(177,60,255,0.15)" stroke-width="1"/>
