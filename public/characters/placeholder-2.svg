      <stop offset="0%" stop-color="#0b0a0d"/>
      <stop offset="100%" stop-color="#1f0f14"/>
    </linearGradient>
    <radialGradient id="glow2" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#ff2f6d" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <filter id="blur2">
