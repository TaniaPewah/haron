  <rect width="400" height="520" fill="url(#bg2)"/>
  <circle cx="200" cy="200" r="140" fill="url(#glow2)"/>
  <!-- Female warrior silhouette with braided hair -->
  <path d="M120 440 L120 290 C120 245 140 200 170 185 C165 150 170 100 185 80 C190 100 195 120 200 135 C205 120 210 100 215 80 C230 100 235 150 230 185 C260 200 280 245 280 290 L280 440 Z" fill="#0e0d12" stroke="#ff2f6d" stroke-width="1.5" stroke-opacity="0.3"/>
  <!-- Eye glow -->
