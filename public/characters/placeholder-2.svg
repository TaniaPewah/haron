  <ellipse cx="215" cy="175" rx="6" ry="3" fill="#ff2f6d" opacity="0.6" filter="url(#blur2)"/>
  <!-- Scar markings -->
  <line x1="170" y1="190" x2="160" y2="210" stroke="rgba(255,47,109,0.25)" stroke-width="1.5"/>
  <line x1="230" y1="190" x2="240" y2="210" stroke="rgba(255,47,109,0.25)" stroke-width="1.5"/>
